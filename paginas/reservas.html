<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Reserva tu bicicleta</title>
  <link rel="stylesheet" href="../CSS/reserva.css ">

</head>

<body>
  <main class="isla">
  
    <h1>Reserva tu bicicleta</h1>
    <p class="intro">Completa tus datos y la fecha en que te gustaría reservar.</p>
    
    <form action="#" method="post">
   
      <div class="campo">
      
        <label for="nombre">Nombre completo</label>
        <input id="nombre" name="nombre" type="text" autocomplete="name" placeholder="Ej. Andrea García López" required>
      </div>
    
      <div class="campo">
        <label for="correo">Correo electrónico</label>
        <input id="correo" name="correo" type="email" autocomplete="email" placeholder="tu@correo.com" required>
      </div>
      
      <div class="campo">
        <label for="telefono">Teléfono</label>
        <input id="telefono" name="telefono" type="tel" autocomplete="tel" placeholder="Ej. +57 300 123 4567" required>
      </div>
      
      <div class="campo">
        <label for="fecha">Fecha de reserva</label>
        <label for="hora">Hora de reserva</label>
        <input id="fecha" name="fecha" type="date" required>
        <input id="hora" name="hora" type="time" required>
      </div>


      <button type="submit">Solicitar reserva</button>

    </form>
    <p class="nota">Usaremos tus datos únicamente para gestionar tu reserva.</p>

  </main>
 
</body>

</html>
